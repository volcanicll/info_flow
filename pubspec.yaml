name: info_flow
description: "AI驱动的信息聚合App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # 状态管理
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # 路由
  go_router: ^17.0.0

  # 网络
  dio: ^5.8.0+1
  html: ^0.15.4

  # 本地存储
  shared_preferences: ^2.5.3
  # 本地通知（信号/异动主动触达）
  flutter_local_notifications: ^19.0.0

  # 工具
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  logger: ^2.5.0
  uuid: ^4.5.1
  xml: ^6.6.1
  webview_flutter: ^4.14.0
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
